<!doctype html><meta charset=utf-8>
<style>html,body{margin:0}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id=f src="index.html"></iframe><pre id=out></pre>
<script>
addEventListener("load", () => setTimeout(() => {
  const w = document.getElementById("f").contentWindow, d = w.document;
  const rect = (s) => Math.round(d.querySelector(s).getBoundingClientRect().height);
  const snap = (tag) => [tag, "probeHidden=" + d.getElementById("probe").hidden,
                         "map=" + rect(".map-wrap"), "sheet=" + rect(".sheet"),
                         "rows=" + getComputedStyle(d.body).gridTemplateRows].join(" ");
  const out = [snap("no tap")];
  w.rarnav.feed({ lat: 38.30, lon: 14.80, sog: 6.4, cog: 355 });
  setTimeout(() => {
    d.querySelector(".legs button")?.click();
    out.push(snap("after tap"));
    document.getElementById("out").textContent = out.join("\n");
  }, 500);
}, 2500));
</script>
